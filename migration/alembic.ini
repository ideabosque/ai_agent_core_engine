# -*- coding: utf-8 -*-
# Alembic migration configuration for ai_agent_core_engine PostgreSQL backend.
# The sqlalchemy.url is overridden by env.py (DATABASE_URL env > Config > ini).

[alembic]
# Path to the migration scripts (relative to this file).
script_location = %(here)s/alembic

# Template used to generate migration file names.
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for the timestamp in file names.
timezone = UTC

# Maximum length of characters for slugified fields.
truncate_slug_length = 40

# Placeholder — env.py resolves the real URL from DATABASE_URL / Config.
sqlalchemy.url = postgresql+psycopg2://user:password@localhost:5432/aace

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S